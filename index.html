    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          
          // Define on window with both getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {}

          // Also define on Window.prototype if available
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
